<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#0B0F19" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 900;
      font-size: 44px;
      fill: #FFFFFF;
    }
    .subtitle {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 500;
      font-size: 20px;
      fill: #94A3B8;
    }
    .tag {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 600;
      font-size: 13px;
      fill: #F8FAFC;
    }
    .card-title {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 700;
      font-size: 15px;
      fill: #F1F5F9;
    }
    .card-sub {
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 400;
      font-size: 12px;
      fill: #64748B;
    }
    
    /* Subtle Dynamic Animations */
    @keyframes pulse {
      0% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.03); opacity: 1; }
      100% { transform: scale(1); opacity: 0.8; }
    }
    @keyframes floatSlow {
      0% { transform: translateY(0px); }
      50% { transform: translateY(-8px); }
      100% { transform: translateY(0px); }
    }
    @keyframes dash {
      to { stroke-dashoffset: -40; }
    }

    .animated-bg-line {
      stroke-dasharray: 8 8;
      animation: dash 2.5s linear infinite;
    }
    .pulse-element {
      animation: pulse 4s ease-in-out infinite;
      transform-origin: center;
    }
    .float-element {
      animation: floatSlow 5s ease-in-out infinite;
    }
  </style>

  <!-- Base Card Background -->
  <rect width="1200" height="320" rx="16" fill="url(#bgGrad)" stroke="#334155" stroke-width="1.5" />

  <!-- DYNAMIC BACKGROUND ELEMENTS (Placed behind text/foreground) -->
  <g opacity="0.25">
    <!-- Grid Pattern -->
    <path d="M0,60 H1200 M0,120 H1200 M0,180 H1200 M0,240 H1200" stroke="#334155" stroke-width="1" />
    <path d="M200,0 V320 M400,0 V320 M600,0 V320 M800,0 V320 M1000,0 V320" stroke="#334155" stroke-width="1" />

    <!-- Crane Graphic Silhouette (Far Right Background) -->
    <path d="M950,280 L1020,40 H1150 L1180,90 H1020 M1020,80 L1080,280 M980,280 L1020,160" stroke="#F97316" stroke-width="2" fill="none" />
    <!-- Animated Load line from Crane -->
    <path class="animated-bg-line" d="M1120,40 V180" stroke="#FBBF24" stroke-width="2" />
  </g>

  <!-- Dynamic Decorative Glowing Orbs (Deep Background) -->
  <circle cx="150" cy="80" r="100" fill="#38BDF8" opacity="0.08" filter="url(#glow)" class="pulse-element" />
  <circle cx="1050" cy="220" r="120" fill="#F97316" opacity="0.08" filter="url(#glow)" class="pulse-element" />

  <!-- DYNAMIC CARD INFOGRAPHICS (Positioned on the Right Half, Text remains clear on Left) -->
  <g transform="translate(720, 45)" class="float-element">
    <!-- Semi-transparent UI Card 1: Enterprise SaaS -->
    <rect x="0" y="0" width="420" height="70" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1" opacity="0.9" />
    <circle cx="35" cy="35" r="18" fill="#0EA5E9" opacity="0.2" />
    <path d="M28 35 L33 40 L43 30" stroke="#38BDF8" stroke-width="2.5" fill="none" stroke-linecap="round" />
    <text x="70" y="33" class="card-title">Enterprise SaaS Platforms</text>
    <text x="70" y="52" class="card-sub">Procore ($7.5B) • Autodesk ACC • Buildertrend</text>

    <!-- UI Card 2: Open Source ERP & Tools -->
    <g transform="translate(30, 85)">
      <rect x="0" y="0" width="390" height="70" rx="10" fill="#1E293B" stroke="#475569" stroke-width="1" opacity="0.9" />
      <circle cx="35" cy="35" r="18" fill="#10B981" opacity="0.2" />
      <path d="M27 35 L35 27 L43 35 M35 27 V43" stroke="#34D399" stroke-width="2.5" fill="none" stroke-linecap="round" />
      <text x="70" y="33" class="card-title">Open-Source Ecosystem</text>
      <text x="70" y="52" class="card-sub">OpenProject • OpenConstructionERP • BIMserver</text>
    </g>

    <!-- UI Card 3: Key Modules Badges -->
    <g transform="translate(60, 170)">
      <rect x="0" y="0" width="360" height="48" rx="8" fill="#0F172A" stroke="#334155" stroke-width="1" />
      <text x="20" y="28" font-family="sans-serif" font-size="12" fill="#F97316" font-weight="bold">MODULES:</text>
      <text x="90" y="28" font-family="sans-serif" font-size="12" fill="#94A3B8">BIM • BOQ • 4D/5D • Field • RFIs</text>
    </g>
  </g>

  <!-- MAIN FOREGROUND TEXT & BRANDING (Left Aligned - Never obscured) -->
  <g transform="translate(60, 0)">
    <!-- Top Pill Badge -->
    <g transform="translate(0, 50)">
      <rect x="0" y="0" width="230" height="28" rx="14" fill="url(#orangeGrad)" opacity="0.15" />
      <rect x="0" y="0" width="230" height="28" rx="14" fill="none" stroke="#F97316" stroke-width="1.2" />
      <circle cx="14" cy="14" r="4" fill="#F97316" class="pulse-element" />
      <text x="28" y="19" class="tag" fill="#F97316">CURATED ECOSYSTEM 2026</text>
    </g>

    <!-- Main Title with Gradient Accent -->
    <text x="0" y="130" class="title">
      Awesome Construction
    </text>
    <text x="0" y="180" class="title" fill="url(#orangeGrad)">
      Project Management 🏗️
    </text>

    <!-- Subtitle Description -->
    <text x="0" y="222" class="subtitle">
      Top SaaS Platforms &amp; Open-Source Construction Software
    </text>

    <!-- Feature Pills -->
    <g transform="translate(0, 250)">
      <!-- Pill 1 -->
      <rect x="0" y="0" width="130" height="28" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="12" y="18" font-family="sans-serif" font-size="12" fill="#38BDF8" font-weight="600">📊 SaaS Pricing</text>

      <!-- Pill 2 -->
      <rect x="140" y="0" width="145" height="28" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="152" y="18" font-family="sans-serif" font-size="12" fill="#34D399" font-weight="600">⭐ Open Source</text>

      <!-- Pill 3 -->
      <rect x="295" y="0" width="155" height="28" rx="6" fill="#1E293B" stroke="#334155" />
      <text x="307" y="18" font-family="sans-serif" font-size="12" fill="#FBBF24" font-weight="600">🏗️ Field &amp; BIM ERP</text>
    </g>
  </g>
</svg>
